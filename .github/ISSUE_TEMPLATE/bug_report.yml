name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! For a security issue, please follow [SECURITY.md](https://github.com/OpenFoundationRenewableOperationGrids/rada-frontend/blob/develop/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the map
        2. Tap a battery bubble
        3. ...
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      multiple: true
      options:
        - iPhone
        - Android phone
        - Tablet
        - Desktop
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Safari 26, Chrome 141...
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Drag images here, or paste console errors. Remove any API key or personal data first.
